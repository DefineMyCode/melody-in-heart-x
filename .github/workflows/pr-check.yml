name: PR Check

# M-6（评审 2026-10-15）：PR / push 到 main 必须先过完整校验（单测 + spotless + 架构校验），
# 与 CLAUDE.md「提交前跑 ./gradlew check」的约定保持一致；发版流水线（release.yml）也依赖同一校验。
# 纯文档改动（docs/openwiki/markdown）不触发（2026-10-15 用户定）。
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "openwiki/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "openwiki/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run check (test + spotlessCheck + verifyProductArchitecture + androidTest compile)
        # assembleDebugAndroidTest：仅编译仪器测试源集（无需设备），防止 UI 签名漂移漏检（2026-10-15）
        # :buildSrc:test：verifyProductArchitecture 规则本体的单测（m-10）
        run: ./gradlew check :app:assembleDebugAndroidTest :buildSrc:test --no-daemon --stacktrace

      - name: Upload test & lint reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*.html
          retention-days: 7
