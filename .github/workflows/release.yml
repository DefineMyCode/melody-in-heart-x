name: Release Build

# push v* tag 自动构建签名 release APK 并发布 GitHub Release + 同步 Gitee Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 tag（如 v3.7.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p key
          echo "$KEYSTORE_B64" | base64 -d > key/mihx
          # 校验 keystore 完整性（能列出 alias 即有效）
          keytool -list -keystore key/mihx -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >/dev/null 2>&1 \
            || { echo "::error::keystore 无效或密码错误"; exit 1; }

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=key/mihx
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Determine version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=melody-heart-${TAG}-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | head -4
          ls -lh "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "melody-heart-${{ steps.version.outputs.tag }}-arm64.apk"

      - name: Upload to workflow artifacts (always)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}
          retention-days: 14

      - name: Create/Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.version.outputs.apk }}"
          # tag 推送时 release 已存在则复用,不存在则用 tag message 作说明创建
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$APK" --clobber

      - name: Sync to Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.version.outputs.apk }}"
          export GITEE_TOKEN
          # 全 python 完成: 读 GitHub release 说明 → 查/建 Gitee release → 传附件。
          # 不经 shell 变量中转, 避免 release 正文中的引号破坏命令行。
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request, urllib.parse
          token = os.environ["GITEE_TOKEN"]
          tag = "${{ steps.version.outputs.tag }}"
          apk = "${{ steps.version.outputs.apk }}"
          base = "https://gitee.com/api/v5/repos/deng-chongshuang_admin/melody-in-heart-x/releases"

          def req(url, data=None):
              r = urllib.request.Request(url, data=json.dumps(data).encode() if data else None,
                                         headers={"Content-Type": "application/json"} if data else {})
              return json.load(urllib.request.urlopen(r))

          body = subprocess.run(
              ["gh", "release", "view", tag, "--json", "body", "--jq", ".body"],
              capture_output=True, text=True,
          ).stdout.strip() or tag

          try:
              existing = req(f"{base}?access_token={urllib.parse.quote(token)}&per_page=100")
              rid = next((r["id"] for r in existing if isinstance(r, dict) and r.get("tag_name") == tag), 0)
          except Exception as e:
              print(f"list releases failed: {e}")
              rid = 0
          if not rid:
              created = req(f"{base}?access_token={urllib.parse.quote(token)}",
                            {"tag_name": tag, "target_commitish": "main", "name": tag, "body": body})
              rid = created.get("id", 0)
          if not rid:
              sys.exit("::error::Gitee release 创建失败")

          att = subprocess.run(
              ["curl", "-s", "-X", "POST",
               f"{base}/{rid}/attach_files",
               "-F", f"access_token={token}", "-F", f"file=@{apk}"],
              capture_output=True, text=True)
          result = json.loads(att.stdout)
          assert result.get("name"), result
          print(f"Gitee attachment OK: {result['name']}")
          PY
