# 情绪坐标系规格清单 —— 情绪模型版本的**单一真源**。
#
# 本文件由 :core:model 的 generateEmotionModelSpec 任务读取，生成 EmotionModelSpec.kt
# （常量），全仓只此一份定义：:player 的 EmotionAnalyzer、:data 的 Room 迁移、
# :core:model 的锚点表一致性单测都引用生成物，不再各写一份手抄值。
#
# ── 三样东西必须一起改 ────────────────────────────────────────────────
# 1) label      坐标系的**语义身份**（人可读）。
#               改它 = 换了一套坐标系 → 必须重新标定锚点表，并把旧的那套
#               留档到 EmotionGroup.LEGACY_ANCHORS（否则老曲线会用错锚点投票）。
# 2) 下面参数    A（arousal 真实响度映射）/ B（valence 零点斜率标定）的取值。
#               改它们 = 曲线坐标定义变了 → **必须同时改 label + 重标定锚点表**。
#               忘了 → 参数指纹变 → EmotionGroupAnchorTest 会红（不是静默出错）。
# 3) 资产哈希    两个 tflite 的 SHA-256。
#               **换了资产忘记改这里 → 构建直接失败**（generateEmotionModelSpec
#               校验），不会出现"老数据静默留存、永远不重扫"。
#
# ── 指纹怎么用 ───────────────────────────────────────────────────────
# PARAMS_FINGERPRINT = hash(label + 下面参数)   → 锚点表是按这组参数标定的
# FINGERPRINT        = hash(label + 参数 + 资产哈希) → 这条曲线是这版权本产出的
# modelVersion       = "<label>@<FINGERPRINT>"
#   · 锚点表按 **label** 选（见 EmotionGroup.anchorsFor）—— 指纹不影响投票
#   · 重扫判定比 **整个 modelVersion**（见 EmotionScanWorker）—— 指纹变了就重扫
#
label = yamnet-va-v5-vocal

# A：arousal 改真实响度包络后的 dB → [-1,1] 映射区间（dBFS）
dbFloor = -30.0
dbCeil = -5.0

# B：valence 零点/斜率标定 v' = (v - vCalBias) / vCalScale
vCalBias = 0.25
vCalScale = 0.85

# C：人声成分补偿 —— 器乐组（vocalScore 低于阈值）的 valence 上移量
#
# 为什么需要它（2026-10-25，全库 1095 首真值）：
#   valence 有一部分在测「有没有人唱」而不是「什么情绪」。
#   全库按 vocalScore 分组（阈值取 valence~vocalScore 的断点 0.010）：
#     人声组 376 首 valence +0.120 / 器乐组 719 首 valence -0.041，差 -0.162
#   其中约一半能被「人声多的歌也更响更 energetic」解释（arousal 是物理 RMS）：
#     在 arousal 分箱内匹配后，残余差只有 -0.091
#   独立模型对照（MusicNN DEAM 头，64 首）同样做 arousal 匹配：
#     它自己的匹配差是 +0.026（≈0），现网是 -0.164
#     —— 独立模型没有这层成分，现网有。
#   所以补偿量取 arousal 匹配后的残余差 0.091：
#     只扣掉能量效应解释不了的那部分，保留「器乐曲真的更安静/更沉郁」的真实差异。
#
# 改这三个数（label / vocalComp*）= 换坐标系 → 必须重标定锚点表并做版本迁移。
vocalCompShift = 0.091
vocalCompThreshold = 0.010

# 资产哈希（换资产必须同步更新，否则构建失败）
yamnetSha256 = db0bb6fba15101e4c598e5940a30b905c6b35c20c0f242e51fa53736906df877
headSha256 = edbc3e4eafcc0e9bd1d4e013a397735f4c7f7593b94ed2136c7cf52f8f7e638d
