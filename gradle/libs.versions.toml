[versions]
agp                      = "8.13.0"
kotlin                   = "2.0.21"
ksp                      = "2.0.21-1.0.28"
coreKotlin               = "2.0.21"
composeBom               = "2025.04.01"
material3Adaptive        = "1.3.2"
media3                   = "1.9.0"
hilt                     = "2.57"
hiltNavigationCompose     = "1.2.0"
room                     = "2.7.1"
datastore                = "1.1.1"
navigationCompose        = "2.9.0"
kotlinxSerialization     = "1.7.3"
kotlinxCoroutines        = "1.10.1"
coil                     = "2.7.0"
benchmarkMacro           = "1.3.4"
lifecycle                = "2.9.0"
coreKtx                  = "1.15.0"
coreSplashscreen         = "1.0.1"
jellyfinFfmpeg           = "1.9.0+1"
compileSdk               = "36"
minSdk                   = "33"
targetSdk                = "36"
jvmTarget                = "17"
spotless                 = "6.25.0"
ktlint                   = "1.3.0"
junitJupiter            = "5.11.4"
robolectric              = "4.12.2"
androidxTestCore         = "1.6.1"

[plugins]
androidApplication      = { id = "com.android.application", version.ref = "agp" }
androidLibrary          = { id = "com.android.library", version.ref = "agp" }
androidTest             = { id = "com.android.test", version.ref = "agp" }
kotlinAndroid           = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinJvm               = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinCompose           = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization      = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room                    = { id = "androidx.room", version.ref = "room" }

[libraries]
# AndroidX core
coreKtx                 = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
coreSplashscreen        = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
lifecycleRuntimeKtx     = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycleViewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose
composeBom              = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeMaterial3        = { module = "androidx.compose.material3:material3" }
composeMaterial3AdaptiveNavSuite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3Adaptive" }
composeUiToolingPreview  = { module = "androidx.compose.ui:ui-tooling-preview" }
composeFoundation       = { module = "androidx.compose.foundation:foundation" }
composeRuntime          = { module = "androidx.compose.runtime:runtime" }
composeUi               = { module = "androidx.compose.ui:ui" }
composeMaterialIconsExtended = { module = "androidx.compose.material:material-icons-extended" }
activityCompose         = { module = "androidx.activity:activity-compose" }

# Navigation
navigationCompose       = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Media3 (player + system integration)
media3Exoplayer         = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3Session           = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3Common            = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3UiCompose         = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
jellyfinFfmpeg          = { module = "org.jellyfin.media3:media3-ffmpeg-decoder", version = "1.9.0+1" }

# DI
hiltAndroid             = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hiltCompiler            = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hiltNavigationCompose   = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Persistence
roomRuntime             = { module = "androidx.room:room-runtime", version.ref = "room" }
roomKtx                 = { module = "androidx.room:room-ktx", version.ref = "room" }
roomCompiler            = { module = "androidx.room:room-compiler", version.ref = "room" }
datastorePreferences    = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Coroutines / Serialization
kotlinxCoroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesCore    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Image loading
coil                    = { module = "io.coil-kt:coil", version.ref = "coil" }
coilCompose             = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Benchmark
benchmarkMacro          = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacro" }
benchmarkMacroGenerator = { module = "androidx.benchmark:benchmark-macro-generator", version.ref = "benchmarkMacro" }
androidxTestJUnit       = { module = "androidx.test.ext:junit", version = "1.2.1" }
androidxTestRunner      = { module = "androidx.test:runner" }
truth                   = { module = "com.google.truth:truth", version = "1.4.4" }
robolectric             = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidxTestCore        = { module = "androidx.test:core", version.ref = "androidxTestCore" }

# Unit testing (JVM modules: domain / core:model)
junitJupiter            = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
kotlinxCoroutinesTest   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
javaxInject             = { module = "javax.inject:javax.inject", version = "1" }

# ---- Gradle plugin artifacts (used by build-logic) ----
androidGradlePlugin      = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlinGradlePlugin       = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinComposeCompilerGradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kspGradlePlugin          = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hiltGradlePlugin         = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
roomGradlePlugin         = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
spotlessGradlePlugin     = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
